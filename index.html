for(let j=0;j<280;j++)for(let i=0;i<280;i++){if(img[(j*280+i)*4]>40){if(i<x0)x0=i;if(i>x1)x1=i;if(j<y0)y0=j;if(j>y1)y1=j;}}
if(x1<0)return;
const w=x1-x0+1,h=y1-y0+1,s=20/Math.max(w,h);
const t=document.createElement('canvas');t.width=28;t.height=28;
const g=t.getContext('2d');g.fillStyle='#000';g.fillRect(0,0,28,28);
g.imageSmoothingEnabled=true;g.imageSmoothingQuality='high';
g.drawImage(c,x0,y0,w,h,14-w*s/2,14-h*s/2,w*s,h*s);
const px=g.getImageData(0,0,28,28).data;
const inp=new Float32Array(784);
for(let k=0;k<784;k++)inp[k]=px[k*4]/255;
const h1=new Float32Array(128);
for(let i=0;i<128;i++){let a=W.b1[i];for(let k=0;k<784;k++)a+=W.w1[i*784+k]*inp[k];h1[i]=a>0?a:0;}
const o=[];
for(let i=0;i<10;i++){let a=W.b2[i];for(let k=0;k<128;k++)a+=W.w2[i*128+k]*h1[k];o.push(a);}
const m=Math.max(...o),e=o.map(v=>Math.exp(v-m)),z=e.reduce((a,b)=>a+b),p=e.map(v=>v/z);
const best=p.indexOf(Math.max(...p));
document.getElementById('res').textContent=best+' ('+Math.round(p[best]*100)+'%)';
document.getElementById('pr').textContent=p.map((v,i)=>i+':'+Math.round(v*100)).join('  ');
}
